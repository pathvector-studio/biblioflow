name: biblioflow

# Every container: rotate the json-file log (Docker's default keeps it forever).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-build: &backend-build
  context: ./backend
  args:
    UID: ${APP_UID:-1000}
    GID: ${APP_GID:-1000}
    INSTALL_DEV: ${INSTALL_DEV:-false}

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@biblioflow-db:5432/${POSTGRES_DB:?}
  TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@biblioflow-db:5432/biblioflow_test
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@biblioflow-redis:6379/0

# Embedding settings: the only configuration the model-init and embedder containers get (no env_file: they must
# not see the database password, the JWT key or any API key).
x-embedding-env: &embedding-env
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  EMBEDDING_LOCAL_PRECISION: ${EMBEDDING_LOCAL_PRECISION:-int8}
  MODELS_DIR: /models

x-backend-common: &backend-common
  env_file: .env
  environment: *backend-env
  volumes:
    - ./data/library:/data/library
    - ./data/watch:/data/watch
  networks:
    - biblioflow-internal
    - biblioflow-edge
  depends_on:
    biblioflow-db:
      condition: service_healthy
    biblioflow-redis:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  biblioflow-db:
    image: pgvector/pgvector:pg16
    container_name: ${BF_INSTANCE:-biblioflow}-db
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - biblioflow-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  biblioflow-redis:
    # Valkey (BSD-3, a Linux Foundation fork of Redis 7.2) instead of Redis 7.4+ (RSALv2/SSPLv1/AGPLv3).
    # Service name, REDIS_URL and the Redis protocol stay the same.
    image: valkey/valkey:9-alpine
    container_name: ${BF_INSTANCE:-biblioflow}-redis
    logging: *logging
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - valkeydata:/data
    networks:
      - biblioflow-internal
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  biblioflow-api:
    <<: *backend-common
    build: *backend-build
    container_name: ${BF_INSTANCE:-biblioflow}-api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  biblioflow-worker:
    <<: *backend-common
    build: *backend-build
    container_name: ${BF_INSTANCE:-biblioflow}-worker
    command: ["arq", "app.workers.settings.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Downloads the pinned embedding model once (sha256-verified, int8-quantized) into the `models` volume, then
  # exits. Needs the internet, so it sits on the edge network; it does nothing unless EMBEDDING_PROVIDER=local.
  biblioflow-model-init:
    build: *backend-build
    container_name: ${BF_INSTANCE:-biblioflow}-model-init
    logging: *logging
    command: ["python", "-m", "app.embedder.fetch"]
    environment: *embedding-env
    volumes:
      - models:/models
    networks:
      - biblioflow-edge
    # int8 quantization peaks at about 8.7 GiB (measured) for ~10 s, once; fp32 needs almost nothing.
    mem_limit: ${MODEL_INIT_MEM_LIMIT:-10g}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # The one resident embedding model. Internal network only (it cannot reach the internet), no secrets, models
  # mounted read-only. The API (search queries) and the worker (indexing) call it over HTTP.
  biblioflow-embedder:
    build: *backend-build
    container_name: ${BF_INSTANCE:-biblioflow}-embedder
    logging: *logging
    command: ["uvicorn", "app.embedder.server:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *embedding-env
      EMBEDDER_THREADS: ${EMBEDDER_THREADS:-4}
    expose:
      - "8001"
    volumes:
      - models:/models:ro
    networks:
      - biblioflow-internal
    mem_limit: ${EMBEDDER_MEM_LIMIT:-3g}
    cpus: ${EMBEDDER_CPUS:-4}
    depends_on:
      biblioflow-model-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  biblioflow-frontend:
    build:
      context: ./frontend
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://biblioflow-api:8000}
    container_name: ${BF_INSTANCE:-biblioflow}-frontend
    logging: *logging
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://biblioflow-api:8000}
    # Not published: reached only through biblioflow-gateway.
    expose:
      - "3000"
    networks:
      - biblioflow-edge
    depends_on:
      biblioflow-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # The only service published to the host. Three listeners:
  #   :8080 (published)     untrusted clients; X-Forwarded-* from clients is discarded
  #   :8081 (NOT published) cloudflared only; client IP from CF-Connecting-IP
  #   :8082 (NOT published) tailscale only; client IP from X-Forwarded-For
  biblioflow-gateway:
    image: caddy:2.11.7-alpine
    container_name: ${BF_INSTANCE:-biblioflow}-gateway
    logging: *logging
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      XDG_DATA_HOME: /tmp/caddy-data
      XDG_CONFIG_HOME: /tmp/caddy-config
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - biblioflow-edge
    depends_on:
      biblioflow-frontend:
        condition: service_healthy
      biblioflow-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # the caddy binary carries this file capability; without it exec fails
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # Optional: expose the app through Cloudflare Tunnel (outbound only, no open ports).
  #   docker compose --profile cloudflare up -d
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env. In Cloudflare Zero Trust, route the
  # public hostname to http://biblioflow-gateway:8081 (trusted listener).
  biblioflow-cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: ${BF_INSTANCE:-biblioflow}-cloudflared
    logging: *logging
    profiles: ["cloudflare"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      # Not ":?" — compose interpolates every service, so a required var would
      # break `docker compose up` for users who never enable this profile.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - biblioflow-edge
    depends_on:
      biblioflow-gateway:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Optional: expose the app on your tailnet over HTTPS (userspace networking, outbound only).
  #   docker compose --profile tailscale up -d
  # Requires TS_AUTHKEY in .env on first start (state is kept in the tailscale-state volume).
  # Serves https://<TS_HOSTNAME>.<tailnet>.ts.net -> http://biblioflow-gateway:8082.
  # Runs as root inside the container: the official image's containerboot needs to write
  # its state volume and socket, and userspace mode has no NET_ADMIN; all capabilities are dropped.
  biblioflow-tailscale:
    image: tailscale/tailscale:v1.104.4
    container_name: ${BF_INSTANCE:-biblioflow}-tailscale
    logging: *logging
    profiles: ["tailscale"]
    environment:
      # Not ":?" for the same reason as CLOUDFLARE_TUNNEL_TOKEN above.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-biblioflow}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    networks:
      - biblioflow-edge
    depends_on:
      biblioflow-gateway:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  biblioflow-internal:
    name: ${BF_INSTANCE:-biblioflow}-internal
    driver: bridge
    internal: true
  biblioflow-edge:
    name: ${BF_INSTANCE:-biblioflow}-edge
    driver: bridge

volumes:
  pgdata:
  valkeydata:
  models:
  tailscale-state:
