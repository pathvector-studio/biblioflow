# Weekly dependency updates. Minor/patch updates are grouped into one PR per ecosystem;
# security updates are opened separately as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # react-pdf-highlighter-extended 8.x depends on pdfjs-dist ^4, and the viewer's worker must match
      # the API version it bundles. pdfjs-dist 5.6.83 to <6.2.108 also has GHSA-hq66-cqwq-w95j.
      # Lift this when the highlighter supports pdfjs-dist >= 6.2.108.
      - dependency-name: pdfjs-dist
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # litellm 1.104 to 1.109 pin filelock<4, and filelock 3.x has open CVEs (fixed in 4.2.1), so
      # pyproject keeps litellm <1.104. Lift this (and the pin) when a stable litellm allows filelock>=4.2.1.
      - dependency-name: litellm
        versions: [">=1.104"]

  - package-ecosystem: uv
    directory: /mcp
    schedule:
      interval: weekly
    groups:
      mcp-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Base images in backend/Dockerfile and frontend/Dockerfile
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # The backend is locked to Python 3.12 (pyproject requires-python, uv.lock). 3.15 lacks cp315 wheels
      # for onnxruntime (local embeddings) and pyyaml. Move the image together with requires-python.
      - dependency-name: python
        versions: [">=3.13"]

  # Images pinned in docker-compose.yml (caddy, cloudflared, tailscale, pgvector, valkey)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
