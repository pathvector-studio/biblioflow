# Known-vulnerability and license check for production dependencies. Runs on every PR / push to main
# and weekly, so advisories published after a merge are noticed without a code change.
name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # Reads package-lock.json only; dev-only findings (eslint etc.) never ship in the image.
      - run: npm audit --omit=dev --audit-level=high
      - name: Licenses of production dependencies (THIRD_PARTY_NOTICES.md)
        run: python3 ../scripts/check-licenses.py npm package-lock.json

  audit-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: false
      - name: pip-audit (production dependencies from uv.lock)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -q > requirements.txt
          uvx pip-audit@2.10.1 -r requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: Licenses of production dependencies (THIRD_PARTY_NOTICES.md)
        run: |
          uv sync --frozen --no-dev --no-install-project -q
          uv run --no-sync python ../scripts/check-licenses.py python

  audit-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: false
      - name: pip-audit (production dependencies from uv.lock)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -q > requirements.txt
          uvx pip-audit@2.10.1 -r requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: Licenses of production dependencies (THIRD_PARTY_NOTICES.md)
        run: |
          uv sync --frozen --no-dev --no-install-project -q
          uv run --no-sync python ../scripts/check-licenses.py python

  # The browser extension has no dependencies by design; keep it that way, and ship only the files we mean to.
  audit-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node extension/build.mjs
      - name: No dependencies; the zips contain only shipped files
        run: node scripts/check-extension.mjs
