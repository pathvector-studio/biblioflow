name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/biblioflow_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - name: Run tests (integration tests must not be skipped)
        run: |
          uv run pytest -q -rs -p no:cacheprovider | tee pytest.log
          if grep -qi "skipped" pytest.log; then echo "::error::tests were skipped"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  # VERSION is the one place the version is set (scripts/version.py); a release tag must be v$(cat VERSION).
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every copy matches VERSION
        if: github.ref_type != 'tag'
        run: python3 scripts/version.py check
      - name: The tag matches VERSION
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/version.py check --tag "$TAG"

  # No local-environment details (LAN addresses, hostnames, home paths, personal e-mails) in the public repository.
  private-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Files
        run: python3 scripts/check-private-info.py
      - name: Commits in this pull request (e-mails and messages)
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-private-info.py --commits "$RANGE"

  # install.sh (also served at https://biblioflow.pathvector.dev/install.sh): lint, then prepare a checkout of this commit.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh scripts/dev-setup.sh scripts/with-env.sh scripts/check-access.sh scripts/cloudflare-tunnel.sh
      - name: scripts/dev-setup.sh keeps secrets outside the checkout
        env:
          BIBLIOFLOW_CONFIG_DIR: ${{ runner.temp }}/bf-config
        run: |
          out="$(scripts/dev-setup.sh --port 3080 --origin http://192.168.1.10:3080 2>&1)"
          cfg="$BIBLIOFLOW_CONFIG_DIR"
          test "$(readlink .env)" = "$cfg/dev.env"
          test "$(readlink AGENTS.local.md)" = "$cfg/AGENTS.local.md"
          test "$(stat -c %a "$cfg")" = 700
          for f in dev.env mcp.env cloudflare.env AGENTS.local.md; do test "$(stat -c %a "$cfg/$f")" = 600; done
          test "$(grep -cE '^(POSTGRES_PASSWORD|REDIS_PASSWORD|JWT_SECRET)=[0-9a-f]{64}$' .env)" = 3
          grep -qx 'CORS_ALLOWED_ORIGINS=http://localhost:3080,http://192.168.1.10:3080' .env
          # No value is printed, and the links are ignored by git.
          for k in POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET; do if grep -qF "$(sed -n "s/^$k=//p" .env)" <<<"$out"; then echo "$k printed"; exit 1; fi; done
          git check-ignore -q .env
          git check-ignore -q AGENTS.local.md
          test -z "$(git status --porcelain)"
          # A second run changes nothing; a writer that edits .env keeps the link.
          before="$(sha256sum < .env)"
          scripts/dev-setup.sh
          test "$(sha256sum < .env)" = "$before"
          tmp="$(mktemp .env.XXXXXX)"; sed 's/^FRONTEND_PORT=.*/FRONTEND_PORT=3090/' .env > "$tmp"; cat "$tmp" > .env; rm -f "$tmp"
          test -L .env
          grep -qx FRONTEND_PORT=3090 "$cfg/dev.env"
          # with-env.sh refuses a readable file and passes the variables of a private one.
          printf 'BF_TEST=ok\n' > "$cfg/t.env"; chmod 644 "$cfg/t.env"
          if scripts/with-env.sh "$cfg/t.env" -- true; then echo "mode 644 accepted"; exit 1; fi
          chmod 600 "$cfg/t.env"
          test "$(scripts/with-env.sh "$cfg/t.env" -- sh -c 'echo "$BF_TEST"')" = ok
          rm .env AGENTS.local.md
      - name: Prepare without starting
        run: |
          git switch -c ci-installer
          BIBLIOFLOW_DIR="$RUNNER_TEMP/bf" BIBLIOFLOW_REPO="$PWD" BIBLIOFLOW_REF=ci-installer BIBLIOFLOW_NO_START=1 bash install.sh
          cd "$RUNNER_TEMP/bf"
          test "$(stat -c %a .env)" = 600
          ! grep -q '=change-me-' .env
          grep -qx "APP_UID=$(id -u)" .env
          grep -qx 'CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000' .env
          docker compose config -q
      - name: Semantic-search question without a terminal
        run: |
          # No tty (CI): the answer is no unless BIBLIOFLOW_SEMANTIC_SEARCH=yes says otherwise.
          run_installer() {
            rm -rf "$RUNNER_TEMP/bf-ss"
            env "$@" BIBLIOFLOW_DIR="$RUNNER_TEMP/bf-ss" BIBLIOFLOW_REPO="$PWD" BIBLIOFLOW_REF=ci-installer BIBLIOFLOW_NO_START=1 bash install.sh </dev/null
          }
          run_installer BIBLIOFLOW_SEMANTIC_SEARCH=
          grep -qx 'EMBEDDING_PROVIDER=none' "$RUNNER_TEMP/bf-ss/.env"
          run_installer BIBLIOFLOW_SEMANTIC_SEARCH=no
          grep -qx 'EMBEDDING_PROVIDER=none' "$RUNNER_TEMP/bf-ss/.env"
          run_installer BIBLIOFLOW_SEMANTIC_SEARCH=yes
          grep -qx 'EMBEDDING_PROVIDER=local' "$RUNNER_TEMP/bf-ss/.env"
          docker compose --project-directory "$RUNNER_TEMP/bf-ss" config -q
      - name: Default ref is the latest release tag
        run: |
          for t in v0.9.0 v0.10.0 v1.0.0-rc1 vnext; do git tag "$t"; done
          BIBLIOFLOW_DIR="$RUNNER_TEMP/bf-tag" BIBLIOFLOW_REPO="$PWD" BIBLIOFLOW_NO_START=1 bash install.sh | tee "$RUNNER_TEMP/out.txt"
          grep -qF '(v0.10.0)' "$RUNNER_TEMP/out.txt"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env
        run: |
          cp .env.example .env
          # EMBEDDING_PROVIDER stays at its default, none: the smoke test downloads no model.
          grep -qx 'EMBEDDING_PROVIDER=none' .env
          for k in POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET; do
            sed -i "s|^$k=.*|$k=$(openssl rand -hex 32)|" .env
          done
      - run: docker compose config -q
      - run: docker compose --profile cloudflare config -q
      - run: docker compose --profile tailscale config -q
      - name: A second instance gets its own container and network names
        run: |
          out="$(BF_INSTANCE=biblioflow-prod COMPOSE_PROJECT_NAME=biblioflow-prod docker compose --profile cloudflare config --format json)"
          test "$(jq -r '[.services[].container_name] | map(startswith("biblioflow-prod-")) | all' <<<"$out")" = true
          test "$(jq -r '[.networks[].name] | sort | join(",")' <<<"$out")" = "biblioflow-prod-edge,biblioflow-prod-internal"
          test "$(docker compose config --format json | jq -r '.services["biblioflow-api"].container_name')" = biblioflow-api
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test via gateway
        run: |
          curl -fsS http://127.0.0.1:3000/api/v1/healthz
          curl -fsS http://127.0.0.1:3000/healthz
      - name: Verify DB/Redis are not published
        run: |
          test -z "$(docker compose port biblioflow-db 5432 2>/dev/null | grep -v ':0$')"
          test -z "$(docker compose port biblioflow-redis 6379 2>/dev/null | grep -v ':0$')"
      - name: Verify only the gateway is published
        run: |
          test -z "$(docker compose port biblioflow-frontend 3000 2>/dev/null | grep -v ':0$')"
          test -z "$(docker compose port biblioflow-api 8000 2>/dev/null | grep -v ':0$')"
          test -z "$(docker compose port biblioflow-gateway 8081 2>/dev/null | grep -v ':0$')"
          test -z "$(docker compose port biblioflow-gateway 8082 2>/dev/null | grep -v ':0$')"
      - name: Verify body size limits
        run: |
          head -c $((4*1024*1024+1)) /dev/zero > big.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Expect:' -H 'Content-Type: application/json' --data-binary @big.json http://127.0.0.1:3000/api/v1/auth/login)
          echo "oversized JSON -> $code"; test "$code" = 413
      - name: Backup and restore round trip
        run: |
          export BACKUP_DIR="$RUNNER_TEMP/backups"
          scripts/backup.sh
          snap="$(ls -1d "$BACKUP_DIR"/2*Z | tail -n 1)"
          scripts/restore.sh --check "$snap"
          sleep 1
          scripts/restore.sh --yes "$snap"
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:3000/api/v1/readyz
      - name: Verify non-root
        run: |
          for s in biblioflow-api biblioflow-worker biblioflow-embedder biblioflow-frontend biblioflow-gateway; do
            uid=$(docker compose exec -T $s id -u); echo "$s uid=$uid"; test "$uid" != "0"
          done
      - name: Verify the embedder is isolated and, by default, off
        run: |
          # No consent, no model: model-init downloaded nothing and the embedder says so.
          test "$(docker compose exec -T biblioflow-embedder python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8001/healthz'))['model'])")" = disabled
          docker compose logs biblioflow-model-init | grep -q 'nothing is downloaded'
          test "$(docker compose exec -T biblioflow-embedder sh -c 'ls /models | wc -l')" = 0
          test "$(docker inspect -f '{{json .NetworkSettings.Networks}}' biblioflow-embedder | jq -r 'keys | join(",")')" = biblioflow-internal
          test -z "$(docker compose exec -T biblioflow-embedder env | grep -E '^(POSTGRES|REDIS|JWT|DATABASE|LLM|EMBEDDING_API)' || true)"
          test -z "$(docker compose port biblioflow-embedder 8001 2>/dev/null | grep -v ':0$')"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
