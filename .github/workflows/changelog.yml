name: Changelog

# Every pull request adds its lines under [Unreleased] in CHANGELOG.md (see RELEASING.md#changelog).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    if: github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CHANGELOG.md is updated
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "$BASE...$HEAD" | grep -qx CHANGELOG.md; then
            echo "::error::Add a line under [Unreleased] in CHANGELOG.md, or label the PR skip-changelog (CI, tests, typos)."
            exit 1
          fi
