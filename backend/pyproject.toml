[project]
name = "biblioflow-backend"
version = "0.2.0"
description = "BiblioFlow backend API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "redis>=5.0",
    "arq>=0.26",
    "typer>=0.12",
    "email-validator>=2.1",
    "httpx>=0.27",
    "pypdf>=5.0",
    "defusedxml>=0.7",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2",
    "litellm>=1.103.10,<1.104",  # 1.104–1.109 pin filelock<4, which has open CVEs (fixed in 4.2.1)
    "pillow>=11.0",
    "bibtexparser>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "onnx>=1.17",  # builds the tiny test graph; the runtime only needs onnxruntime
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
